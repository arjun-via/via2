# Feature-based execution settings
feature_execution:
  max_retries_per_feature: 2  # Fewer retries since Opus is definitive
  checkpoint_after_feature: true
  clean_state_validation: true
  opus_takeover_threshold: 1  # Already Opus, no takeover needed

