id: "03_options_pricing_greeks"
category: "quantitative_finance"
title: "Options Pricing with Greeks and Numerical Stability"
prompt: |
  Implement a production-grade European options pricer that calculates:
  - Option price (Black-Scholes)
  - All Greeks: Delta, Gamma, Vega, Theta, Rho
  - Implied volatility from market prices (Newton-Raphson)

  Critical requirements:
  - Handle extreme inputs without overflow/underflow:
    * Deep ITM/OTM options (strike/spot ratios 0.01 to 100)
    * Near-expiry options (1 hour to maturity)
    * High/low volatility (1% to 500%)
  - Numerical stability for Greeks near expiry (gamma explosion problem)
  - Implied vol solver must converge for difficult cases:
    * Near-zero prices
    * Deep OTM options
    * Short time to expiry
  - Performance: price 10,000 options per second
  - Error handling for no-arbitrage violations

  Edge cases that break naive implementations:
  ```
  # Gamma explosion near expiry
  S=100, K=100, T=0.001 (1 hour), vol=0.2
  # Naive: gamma = 1e6+, crashes

  # Deep OTM implied vol
  Market price = 0.01, S=100, K=200, T=0.5
  # Naive Newton-Raphson: doesn't converge

  # Numerical underflow
  S=100, K=200, T=0.1, vol=0.05
  # N(d2) ≈ 1e-50, causes underflow
  ```

  Provide:
  1. Complete implementation (Python with NumPy)
  2. Numerical stability techniques used
  3. Test cases for all edge cases above
  4. Performance benchmarks
  5. Explanation of where naive BS formula fails

  Do NOT just implement textbook Black-Scholes. Handle production edge cases.

expected_artifacts:
  - language: "python"
  - has_black_scholes: true
  - has_greeks: true
  - has_implied_vol: true
  - handles_edge_cases: true
  - has_numerical_stability: true

evaluation_focus:
  correctness: 0.40
  completeness: 0.30
  code_quality: 0.15
  security: 0.05
  clarity: 0.10
